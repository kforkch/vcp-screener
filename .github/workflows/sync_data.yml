name: Daily Supabase Data Sync

on:
  schedule:
    # 每天 UTC 時間 09:30 運行
    - cron: '30 9 * * *'
  workflow_dispatch: # 允許手動點擊執行

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6  # 🚀 原生支援 Node.js 24

    - name: Set up Python
      uses: actions/setup-python@v6  # 🚀 原生支援 Node.js 24
      with:
        python-version: '3.11'  # 🌟 關鍵修正：升級到 3.11 解決 pandas_ta 與 supabase 安裝衝突！
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # 直接指定安裝，避免 requirements.txt 中的舊版本限制干擾
        pip install pandas yfinance requests supabase lxml cryptography pandas_ta openpyxl

    - name: Run Downloader to Cloud
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python downloader_to_cloud.py
