# .github/workflows/sync_data.yml
name: Daily Supabase Data Sync

on:
  schedule:
    # 每天 UTC 時間 09:30 運行 (約台北時間 17:30，港、中、美股市皆已收盤)
    - cron: '30 9 * * *'
  workflow_dispatch: # 允許你在 GitHub 網頁上手動點擊執行測試

# 強制將 Actions 內部的 Node.js 執行器提升至 Node.js 24，解決 Deprecation 警告雜訊
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4  # 升級到支援 Node.js 24/20 的 v4

    - name: Set up Python
      uses: actions/setup-python@v5  # 升級到支援 Node.js 24/20 的 v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # 💡 安全防禦：除了 requirements.txt，額外強制確保關鍵中台與金融運算依賴安裝成功，防止運行時因 Import 錯誤回傳 exit code 1
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install supabase lxml pandas_ta openpyxl yfinance pandas

    - name: Run Downloader to Cloud
      env:
        # 將剛剛在 GitHub 儲存的 Secrets 注入到環境變數中
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python downloader_to_cloud.py
