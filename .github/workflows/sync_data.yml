name: Daily Supabase Data Sync

on:
  schedule:
    # 每天 UTC 時間 09:30 運行 (約台北時間 17:30，港、中、美股市皆已收盤)
    - cron: '30 9 * * *'
  workflow_dispatch: # 允許你在 GitHub 網頁上手動點擊執行測試

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6  # 🚀 直接升級至原生支援 Node.js 24 的 v6 版本！

    - name: Set up Python
      uses: actions/setup-python@v6  # 🚀 直接升級至原生支援 Node.js 24 的 v6 版本！
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # 💡 強制補全中台與數據解析套件，防止 pip 漏掉
        pip install -r requirements.txt
        pip install supabase lxml pandas_ta openpyxl

    - name: Run Downloader to Cloud
      env:
        # 注入儲存的 Secrets 
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python downloader_to_cloud.py
