name: Daily Supabase Data Sync

on:
  schedule:
    # 每天 UTC 時間 09:30 運行 (約台北時間 17:30，港、中、美股市皆已收盤)
    - cron: '30 9 * * *'
  workflow_dispatch: # 允許你在 GitHub 網頁上手動點擊執行測試

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4  # 使用穩定的 v4 

    - name: Set up Python
      uses: actions/setup-python@v5  # 使用穩定的 v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # 💡 強制核心相依套件全手動安裝，防止 requirements.txt 內部版本衝突或格式錯誤
        pip install pandas yfinance requests supabase lxml cryptography

    - name: Run Downloader to Cloud
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python downloader_to_cloud.py
