name: Daily Supabase Data Sync

on:
  schedule:
    # 每天 UTC 時間 09:30 運行
    - cron: '17 22 * * *'
  workflow_dispatch: # 允許手動點擊執行

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6  # 原生支援 Node.js 24

    - name: Set up Python
      uses: actions/setup-python@v6  # 原生支援 Node.js 24
      with:
        python-version: '3.12'  # 🚀 升級到 3.12，完美相容 2026 年最新科學套件的 wheel
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # 1. 先安裝基礎科學計算與核心套件
        pip install pandas numpy requests supabase lxml cryptography openpyxl yfinance
        # 2. 單獨安裝 pandas-ta (使用橫線，並確保相容性)
        pip install pandas-ta

    - name: Run Downloader to Cloud
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python downloader_to_cloud.py
