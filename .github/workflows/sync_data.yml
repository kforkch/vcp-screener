name: Daily Supabase Data Sync

on:
  schedule:
    # 每天 UTC 時間 09:30 運行 (約台北時間 17:30，港、中、美股市皆已收盤)
    - cron: '30 9 * * *'
  workflow_dispatch: # 允許你在 GitHub 網頁上手動點擊執行測試

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6  # 🚀 直接升級至原生支援 Node.js 24 的 v6 版本，徹底消除 Warning 警告

    - name: Set up Python
      uses: actions/setup-python@v6  # 🚀 直接升級至原生支援 Node.js 24 的 v6 版本，徹底消除 Warning 警告
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # 💡 安全防護：有些套件可能在 requirements.txt 中漏掉，這裡強制主動安裝，防止 ModuleNotFoundError 報錯
        pip install -r requirements.txt
        pip install supabase lxml pandas_ta openpyxl

    - name: Run Downloader to Cloud
      env:
        # 將剛剛在 GitHub 儲存的 Secrets 注入到環境變數中
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python downloader_to_cloud.py
